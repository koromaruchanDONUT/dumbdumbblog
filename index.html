<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blog Markdown Converter</title>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
        background: #f5f5f5;
    }

    h1 {
        margin-bottom: 5px;
    }

    .description {
        color: #666;
        margin-bottom: 20px;
    }

    textarea {
        width: 100%;
        min-height: 300px;
        box-sizing: border-box;
        padding: 15px;
        font-family: monospace;
        font-size: 15px;
        border: 1px solid #ccc;
        border-radius: 8px;
        resize: vertical;
    }

    button {
        margin-top: 12px;
        padding: 10px 18px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
    }

    #convertBtn {
        background: #333;
        color: white;
    }

    #copyBtn {
        background: #ddd;
    }

    button:hover {
        opacity: 0.8;
    }

    .output {
        margin-top: 25px;
    }

    pre {
        background: #222;
        color: #eee;
        padding: 15px;
        border-radius: 8px;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        min-height: 150px;
    }
</style>
</head>

<body>

<h1>Markdown → Blog HTML</h1>

<div class="description">
    Write your blog using basic Markdown, then convert it into your custom HTML.
</div>

<textarea id="input" placeholder="Write your blog here...

Example:

Today was a nice day.

This is **bold**, *italic*, ~~strikethrough~~,
__underlined__, and ||a spoiler||."></textarea>

<br>

<button id="convertBtn" onclick="convert()">Convert</button>
<button id="copyBtn" onclick="copyOutput()">Copy HTML</button>

<div class="output">
    <h2>HTML Output</h2>
    <pre id="output"></pre>
</div>


<script>

function escapeHTML(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}


function formatMarkdown(text) {

    // Escape HTML first
    text = escapeHTML(text);

    /*
        IMPORTANT:
        More complicated formatting is handled first.
        This allows formatting to be nested.
    */

    // Bold + Italic
    text = text.replace(
        /\*\*\*(.+?)\*\*\*/g,
        "<strong><em>$1</em></strong>"
    );

    // Bold
    text = text.replace(
        /\*\*(.+?)\*\*/g,
        "<strong>$1</strong>"
    );

    // Italic
    text = text.replace(
        /(?<!\*)\*([^*\n]+?)\*(?!\*)/g,
        "<em>$1</em>"
    );

    // Strikethrough
    text = text.replace(
        /~~(.+?)~~/g,
        "<s>$1</s>"
    );

    // Underline
    text = text.replace(
        /__(.+?)__/g,
        "<u>$1</u>"
    );

    // Spoiler
    text = text.replace(
        /\|\|(.+?)\|\|/g,
        "<spoiler-text>$1</spoiler-text>"
    );

    return text;
}


function convert() {

    const input = document.getElementById("input").value;

    // Normalize line endings
    const text = input.replace(/\r\n/g, "\n");

    // Separate paragraphs by blank lines
    const paragraphs = text.split(/\n\s*\n/);

    const result = paragraphs
        .map(paragraph => {

            paragraph = paragraph.trim();

            if (!paragraph) {
                return "";
            }

            // Convert normal line breaks to <br>
            paragraph = paragraph.replace(/\n/g, "<br>\n");

            // Convert Markdown formatting
            paragraph = formatMarkdown(paragraph);

            return `<span class="p">${paragraph}</span>`;

        })
        .filter(Boolean)
        .join("\n\n");

    document.getElementById("output").textContent = result;
}


function copyOutput() {

    const output = document.getElementById("output").textContent;

    navigator.clipboard.writeText(output).then(() => {

        const button = document.getElementById("copyBtn");

        const oldText = button.textContent;

        button.textContent = "Copied!";

        setTimeout(() => {
            button.textContent = oldText;
        }, 1500);

    });

}

</script>

</body>
</html>
